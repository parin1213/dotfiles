# --- GitHub 公式スキル（github org・拡張同梱） ---
[[skill]]
name = "gh-stack"
type = "ghskill"
# 上の [[gh_extension]] で入れる拡張が同梱する skill（skills/gh-stack/SKILL.md）。
# 検収済み（2026-08-03）: refs/tags/v0.1.0 / tree c95c8b5b の SKILL.md 891 行のみ。
# scripts / allowed-tools 無し・外部取得や隠し指示なしの純知識スキル。
# pin 無し = 最新 tagged release を追従。拡張本体を latest で追うので skill も揃える
# （拡張が更新されてコマンドが変わったとき、skill だけ古いと存在しないコマンドを勧める）。
repo = "github/gh-stack"
skill = "gh-stack"
requires = "gh"

# --- 野良採用（検収フロー通過済み・このリポに vendor して固める） ---
[[skill]]
name = "japanese-tech-writing"
type = "own"
# 出所: gist k16shikano/fd287c3133457c4fd8f5601d34aa817d（rev 5ed08e44, 検収 2026-06-18）。
# 純知識スキル（SKILL.md のみ・scripts/allowed-tools 無し・外部取得や隠し指示なし）を確認済み。
# gist は gh skill が repo として解決できない（ghskill 不可）ため、唯一の手段として vendor=own を採る。
# 更新時は gist 最新 rev を再検収 → skills/japanese-tech-writing/SKILL.md を差し替え → このコメントの rev/日付を更新。

