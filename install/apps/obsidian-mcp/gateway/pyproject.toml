[project]
name = "obsidian-mcp-gateway"
version = "0.1.0"
description = "Obsidian MCP 用 GitHub OAuth gateway"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp==4.1.3",
    "cryptography",
    "py-key-value-aio",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false
exclude-newer = "7 days"
no-build = true

[[tool.uv.index]]
name = "takumi"
url = "https://pypi.flatt.tech/simple/"
default = true

